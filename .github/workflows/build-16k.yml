name: build-16k-worker

# 毎晩 upstream (appflowyinc/appflowy_worker) に新しいバージョンが出ていないか検査し、
# 新しければ OSS AppFlowy-Cloud ソース (jemalloc 非依存 = 16KB ページカーネルで動作) から
# 16K 対応イメージをビルドして ureo/appflowy_worker_16k にプッシュする。
# 公開タグ構成は upstream に倣う: {VER}-amd64 / {VER}-arm64v8 / マニフェスト {VER} / latest
# ビルドキャッシュ: Docker Hub registry cache (mode=max) を次回実行時に cache-from で復元
on:
  schedule:
    - cron: '0 15 * * *'  # JST 00:00
  workflow_dispatch:
    inputs:
      version:
        description: 'タグバージョン (空 = upstream 最新を自動検出)'
        required: false
        default: ''
      force:
        description: '同一バージョンタグが既に存在しても再ビルドする'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-16k.yml'

permissions:
  contents: read

concurrency:
  group: build-16k-worker
  cancel-in-progress: false

env:
  UPSTREAM_IMAGE: appflowyinc/appflowy_worker
  TARGET_IMAGE: ureo/appflowy_worker_16k
  SOURCE_REPO: AppFlowy-IO/AppFlowy-Cloud
  SOURCE_REF: main

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve upstream version / decide build
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event_name == 'push' || github.event.inputs.force == 'true' }}
        run: |
          set -euo pipefail
          ver="$INPUT_VERSION"
          if [ -z "$ver" ]; then
            ver="$(for p in 1 2 3; do
                      curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/${UPSTREAM_IMAGE}/tags/?page_size=100&ordering=last_updated&page=${p}" \
                        | jq -r '.results[]?.name // empty'
                    done | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1)"
          fi
          if [ -z "$ver" ]; then
            echo "::error::upstream バージョンを検出できませんでした"
            exit 1
          fi
          echo "検出した upstream 最新版: $ver"
          build=true
          if [ "$FORCE" != "true" ] && \
             curl -fs -o /dev/null "https://hub.docker.com/v2/repositories/${TARGET_IMAGE}/tags/${ver}"; then
            build=false
            echo "${TARGET_IMAGE}:${ver} は既に存在するためビルドをスキップします"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            suffix: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: arm64v8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout AppFlowy-Cloud (OSS source, jemalloc-free)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: cloud

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.suffix }}
        uses: docker/build-push-action@v6
        with:
          context: cloud
          file: cloud/services/appflowy-worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          load: true
          provenance: false
          tags: |
            ${{ env.TARGET_IMAGE }}:${{ needs.detect.outputs.version }}-${{ matrix.suffix }}
            ${{ env.TARGET_IMAGE }}:latest-${{ matrix.suffix }}
          # Docker Hub レジストリキャッシュ (OCI artifact, 中間段込み mode=max)。
          # ネイティブ cargo ビルド (~30分) を次回 ~数分に短縮。
          # per-arch ref にして amd64/arm64 同時書き込みの衝突を回避。
          # 納品タグと同じ repo 内 (buildcache-* タグ) = 既存公開 repo なので
          # 自動作成の可視性/クォータ懸念なし。
          cache-from: type=registry,ref=${{ env.TARGET_IMAGE }}:buildcache-${{ matrix.suffix }},image-manifest=true
          cache-to: type=registry,ref=${{ env.TARGET_IMAGE }}:buildcache-${{ matrix.suffix }},mode=max,image-manifest=true,ignore-empty=true,oci-mediatypes=true

      - name: Verify jemalloc-free binary (16KB-page capable)
        run: |
          set -euo pipefail
          image="${TARGET_IMAGE}:${{ needs.detect.outputs.version }}-${{ matrix.suffix }}"
          n="$(docker run --rm --entrypoint sh "$image" -c 'grep -cac jemalloc /usr/local/bin/appflowy_worker; true')"
          docker run --rm --entrypoint ls "$image" -lh /usr/local/bin/appflowy_worker | tail -n1
          echo "jemalloc ヒット数: ${n}"
          if [ "$n" != "0" ]; then
            echo "::error::バイナリに jemalloc が混入しています (16KB ページカーネルで起動不可)"
            exit 1
          fi
          echo "✅ jemalloc-free: 16KB ページ環境で動作可能"

  fidelity:
    name: 忠実性 — 公式exeと同系統か (関数名集合)
    # 夜間ごとに latest 相当へ回帰チェック (ビルド有無に依らず実行)
    needs: [detect, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VER: ${{ needs.detect.outputs.version }}
    steps:
      - name: Extract arm64 exes (official / ours)
        run: |
          set -euo pipefail
          mkdir -p bins
          for spec in "official=${UPSTREAM_IMAGE}:${VER}-arm64v8" \
                      "ours=${TARGET_IMAGE}:${VER}-arm64v8"; do
            name="${spec%%=*}"; img="${spec#*=}"
            docker pull --platform linux/arm64 "$img" >/dev/null
            cid="$(docker create --platform linux/arm64 "$img" true)"
            docker cp "$cid:/usr/local/bin/appflowy_worker" "bins/$name.bin"
            docker rm -f "$cid" >/dev/null
            echo "$name: $(stat -c%s bins/$name.bin) bytes"
          done
      - name: Compare appflowy function-name sets
        run: |
          set -euo pipefail
          # readelf -sW 列: Num: Value Size TYPE Bind Vis Ndx Name → FUNC は $4。
          # 単相化ハッシュ (…17h<16hex>E) を除去して集合化。アロケータ有無は
          # appflowy 系名には無関係なので比較信号としてクリーン。
          names() {
            LC_ALL=C readelf -sW "$1" \
              | awk '$4=="FUNC" && $7!="UND" {print $8}' \
              | grep -a appflowy \
              | sed -E 's/1[0-9]h[0-9a-f]{16}E$/E/' | sort -u
          }
          names bins/official.bin > bins/official.names
          names bins/ours.bin     > bins/ours.names
          wc -l bins/official.names bins/ours.names
          test -s bins/official.names
          test -s bins/ours.names
          python3 - <<'PY'
          import sys
          o = set(open('bins/official.names').read().split())
          u = set(open('bins/ours.names').read().split())
          inter = len(o & u)
          cover = inter / len(o) if o else 0.0
          jac = inter / len(o | u) if (o | u) else 0.0
          only_off = sorted(o - u)[:15]
          msg = ("official names=%d ours=%d coverage_official_in_ours=%.3f "
                 "jaccard=%.3f" % (len(o), len(u), cover, jac))
          print(msg)
          with open('/tmp/summary.md', 'w') as f:
              f.write('## 忠実性チェック (appflowy系 関数名集合)\n\n' + msg + '\n')
              if only_off:
                  f.write('\n公式にあって ours に無い例:\n```\n'
                          + '\n'.join(only_off) + '\n```\n')
          if cover < 0.5 or inter == 0:
              print('::error::系統不一致 (%s)' % msg)
              sys.exit(1)
          if cover < 0.85:
              print('::warning::公式の新機能が ours に未吸収の可能性 (%s)' % msg)
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: スモーク — 起動 /metrics 200 / panic 無し
    needs: [detect, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VER: ${{ needs.detect.outputs.version }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start deps (postgres / redis / minio)
        run: |
          set -euo pipefail
          # services+args スキーマ制約を避け、専用 network 上の素の docker run で構成
          docker network create dep >/dev/null
          docker run -d --name pg --network dep \
            -e POSTGRES_USER=appflowy -e POSTGRES_PASSWORD=appflowy \
            -e POSTGRES_DB=appflowy postgres:15 >/dev/null
          docker run -d --name rd --network dep redis:7 >/dev/null
          docker run -d --name mdo --network dep \
            -e MINIO_ROOT_USER=appflowy -e MINIO_ROOT_PASSWORD=appflowypass \
            minio/minio:latest server /data >/dev/null
          pg=''; rd=''
          for i in $(seq 1 45); do
            pg="$(docker exec pg pg_isready -U appflowy -d appflowy >/dev/null 2>&1 && echo ok || true)"
            rd="$(docker exec rd redis-cli ping 2>/dev/null || true)"
            [ "$pg" = ok ] && [ "$rd" = PONG ] && break
            sleep 2
          done
          if [ "$pg" != ok ] || [ "$rd" != PONG ]; then
            echo "::error::deps 起動失敗 (pg=$pg redis=$rd)"
            docker logs --tail 40 pg || true; docker logs --tail 40 mdo || true
            exit 1
          fi
          docker run --rm --network dep minio/mc sh -c '
            i=0
            while [ $i -lt 20 ]; do
              if mc alias set local http://mdo:9000 appflowy appflowypass &&
                 mc mb -p local/appflowy; then exit 0; fi
              i=$((i+1)); sleep 3
            done
            exit 1'

      - name: Run worker and probe /metrics
        run: |
          set -euo pipefail
          docker pull -q "${TARGET_IMAGE}:${VER}-amd64"
          docker run -d --name wk --network dep \
            -e APPFLOWY_ENVIRONMENT=production \
            -e APPFLOWY_WORKER_ENVIRONMENT=production \
            -e RUST_LOG=info \
            -e APPFLOWY_WORKER_REDIS_URL=redis://rd:6379/8 \
            -e APPFLOWY_WORKER_DATABASE_URL=postgres://appflowy:appflowy@pg:5432/appflowy \
            -e APPFLOWY_WORKER_DATABASE_NAME=appflowy \
            -e APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=5 \
            -e APPFLOWY_S3_USE_MINIO=true \
            -e APPFLOWY_S3_MINIO_URL=http://mdo:9000 \
            -e APPFLOWY_S3_ACCESS_KEY=appflowy \
            -e APPFLOWY_S3_SECRET_KEY=appflowypass \
            -e APPFLOWY_S3_BUCKET=appflowy \
            -e APPFLOWY_S3_REGION=us-east-1 \
            -e APPFLOWY_MAILER_SMTP_HOST=127.0.0.1 \
            -e APPFLOWY_MAILER_SMTP_PORT=2525 \
            -e APPFLOWY_MAILER_SMTP_EMAIL=no-reply@example.com \
            -e APPFLOWY_MAILER_SMTP_USERNAME=smoke \
            -e APPFLOWY_MAILER_SMTP_PASSWORD=smoke \
            -e APPFLOWY_MAILER_SMTP_TLS_KIND=wrapper \
            "${TARGET_IMAGE}:${VER}-amd64"
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' wk)"
          ok=false
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/metrics.txt -w '%{http_code}' "http://${ip}:4001/metrics" || true)"
            if [ "$code" = 200 ]; then ok=true; break; fi
            if ! docker inspect -f '{{.State.Running}}' wk | grep -q true; then
              echo '::error::worker が起動中に終了'; docker logs --tail 120 wk; exit 1
            fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::/metrics が 200 を返さずタイムアウト (last=$code)"
            docker logs --tail 120 wk; exit 1
          fi
          # /metrics 成功後もループが回り続けること (遅発 panic / アロケータ失敗検知)
          sleep 25
          docker inspect -f '{{.State.Running}}' wk | grep -q true || {
            echo '::error::起動後にクラッシュ'; docker logs --tail 120 wk; exit 1; }
          docker logs wk > /tmp/worker.log 2>&1 || true
          if grep -qE 'panicked at|memory allocation of' /tmp/worker.log; then
            echo '::error::panic / アロケータ失敗を検出'
            grep -E 'panicked at|memory allocation of' /tmp/worker.log | head -5
            exit 1
          fi
          echo '## smoke OK — /metrics 200 + 25s survival' >> "$GITHUB_STEP_SUMMARY"
          { echo ''; echo '```'; tail -n 12 /tmp/worker.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          head -5 /tmp/metrics.txt >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: [detect, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push multi-arch manifest
        env:
          VER: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${TARGET_IMAGE}:${VER}" \
            -t "${TARGET_IMAGE}:latest" \
            "${TARGET_IMAGE}:${VER}-amd64" \
            "${TARGET_IMAGE}:${VER}-arm64v8"

      - name: Show manifest
        run: docker buildx imagetools inspect "${TARGET_IMAGE}:${{ needs.detect.outputs.version }}"
