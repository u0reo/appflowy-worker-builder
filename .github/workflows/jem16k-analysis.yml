name: jem16k GO/NO-GO analysis
on:
  workflow_dispatch:
    inputs:
      image:
        description: 解析対象の公式 worker イメージ
        default: appflowyinc/appflowy_worker:latest
      jem_commit:
        description: 公式バイナリに組込まれた jemalloc のコミット
        default: e13ca993e8ccb9ba9847cc330696e02839f328f7

jobs:
  extract:
    runs-on: ubuntu-24.04-arm          # = 16K ページホスト
    steps:
      - uses: actions/checkout@v4
      - name: Confirm 16K runner
        run: test "$(getconf PAGE_SIZE)" = 16384
      - name: Extract worker binary
        run: |
          docker pull "${{ inputs.image }}"
          cid=$(docker create "${{ inputs.image }}")
          mkdir -p results
          docker cp "$cid:/usr/local/bin/appflowy_worker" results/worker.bin
          docker rm "$cid"
          sha256sum results/worker.bin | tee results/worker.sha256
      - name: Re-prod abort on 16K host
        run: |
          set +e
          timeout 120 docker run --rm --entrypoint /usr/local/bin/appflowy_worker \
            "${{ inputs.image }}" > results/boot.log 2>&1
          echo "boot_exit=$?" >> results/boot.log
          set -e
          tail -5 results/boot.log
          grep -c 'Unsupported system page size' results/boot.log
      - name: Function fingerprints of official binary
        run: |
          python3 scripts/jem16k.py fp results/worker.bin --filter _rjem \
            > results/official_fp.txt
          wc -l results/official_fp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official
          path: results

  toolchains:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        container: [debian:12, ubuntu:22.04, ubuntu:24.04, fedora:42]
        extra: ['', '-ffunction-sections -fdata-sections -fPIC']
        prof: ['--enable-prof', '']
    steps:
      - uses: actions/checkout@v4
      - name: Build jemalloc lg12 + lg14 in container
        run: |
          docker run --rm -v "$PWD:/ws" -w /ws/ctx \
            -e JEM_COMMIT='${{ inputs.jem_commit }}' \
            -e EXTRA_CFLAGS='${{ matrix.extra }}' \
            -e PROF_FLAG='${{ matrix.prof }}' \
            -e TAG='container=${{ matrix.container }} CFLAGS=[${{ matrix.extra }}] ${{ matrix.prof }}' \
            '${{ matrix.container }}' \
            bash -c 'exec bash /ws/scripts/ci_toolchain_build.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: tc-${{ strategy.job-index }}
          path: |
            ctx/fp12.txt
            ctx/fp14.txt
            ctx/patches.json
            ctx/meta.txt
            ctx/gcc-version.txt
            ctx/control.txt

  analyze:
    runs-on: ubuntu-24.04
    needs: [extract, toolchains]
    if: always() && needs.extract.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: arts
      - name: Fingerprint match rate (toolchain identity)
        run: |
          echo '## 関数指紋一致率: 公式 vs lg12 ビルド (高いほど移植可能)' > sec1
          echo '```' >> sec1
          python3 scripts/jem16k.py match arts/official/results/official_fp.txt \
            arts/tc-*/ctx/fp12.txt >> sec1 2>&1 || true
          echo '```' >> sec1
          cat sec1 >> "$GITHUB_STEP_SUMMARY"
      - name: patches.json summary
        run: |
          for d in arts/tc-*/ctx; do
            [ -f "$d/patches.json" ] || continue
            echo "---"
            echo "### $(head -1 "$d/meta.txt" 2>/dev/null || echo $d)"
            jq -c '.totals | {funcs, identical, changed_funcs, exact, renamed,
              ambig, unaligned: (.unaligned_funcs | length),
              missing: (.missing_in14 | length)}' "$d/patches.json"
            jq '.totals.pattern_census | to_entries[:12]' "$d/patches.json"
          done > summary.txt 2>&1
          { echo '## lg12→lg14 差分の内訳 (conf=exact/renamed が多いほど安全)'
            echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
