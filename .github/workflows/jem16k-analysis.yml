name: jem16k GO/NO-GO analysis
on:
  workflow_dispatch:
    inputs:
      image:
        description: 解析対象の公式 worker イメージ
        default: appflowyinc/appflowy_worker:latest
      jem_commit:
        description: 公式バイナリに組込まれた jemalloc のコミット
        default: e13ca993e8ccb9ba9847cc330696e02839f328f7

jobs:
  extract:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Host info (runner の PAGE_SIZE を記録)
        run: echo "runner PAGE_SIZE=$(getconf PAGE_SIZE)"
      - name: Ensure docker usable
        id: dock
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io >/dev/null
            sudo systemctl start docker || true
          fi
          if docker info >/dev/null 2>&1; then echo cmd= >> "$GITHUB_OUTPUT"
          elif sudo docker info >/dev/null 2>&1; then echo cmd='sudo ' >> "$GITHUB_OUTPUT"
          else echo 'docker を起動できない'; exit 1; fi
          docker version --format 'server {{.Server.Version}}' 2>/dev/null \
            || sudo docker version --format 'server {{.Server.Version}}'
      - name: Extract worker binary
        run: |
          D='${{ steps.dock.outputs.cmd }}'
          $D docker pull "${{ inputs.image }}"
          cid=$($D docker create "${{ inputs.image }}")
          mkdir -p results
          $D docker cp "$cid:/usr/local/bin/appflowy_worker" results/worker.bin
          $D docker rm "$cid" >/dev/null
          sha256sum results/worker.bin | tee results/worker.sha256
      - name: Boot log on runner host (参考情報)
        run: |
          D='${{ steps.dock.outputs.cmd }}'
          set +e
          timeout 120 $D docker run --rm --entrypoint /usr/local/bin/appflowy_worker \
            "${{ inputs.image }}" > results/boot.log 2>&1
          echo "boot_exit=$?" >> results/boot.log
          set -e
          tail -5 results/boot.log || true
          grep -c 'Unsupported system page size' results/boot.log || true
      - name: Function fingerprints of official binary
        run: |
          python3 scripts/jem16k.py fp results/worker.bin --filter _rjem \
            > results/official_fp.txt
          wc -l results/official_fp.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official
          path: results

  toolchains:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        container: [debian:12, ubuntu:22.04, ubuntu:24.04, fedora:42]
        extra: ['', '-ffunction-sections -fdata-sections -fPIC']
        prof: ['--enable-prof', '']
    steps:
      - uses: actions/checkout@v4
      - name: Ensure docker usable
        id: dock
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io >/dev/null
            sudo systemctl start docker || true
          fi
          if docker info >/dev/null 2>&1; then echo cmd= >> "$GITHUB_OUTPUT"
          elif sudo docker info >/dev/null 2>&1; then echo cmd='sudo ' >> "$GITHUB_OUTPUT"
          else echo 'docker を起動できない'; exit 1; fi
      - name: Build jemalloc lg12 + lg14 in container
        run: |
          D='${{ steps.dock.outputs.cmd }}'
          mkdir -p ctx
          $D docker run --rm -v "$PWD:/ws" -w /ws/ctx \
            -e JEM_COMMIT='${{ inputs.jem_commit }}' \
            -e EXTRA_CFLAGS='${{ matrix.extra }}' \
            -e PROF_FLAG='${{ matrix.prof }}' \
            -e TAG='container=${{ matrix.container }} CFLAGS=[${{ matrix.extra }}] ${{ matrix.prof }}' \
            '${{ matrix.container }}' \
            bash -c 'ls -l /ws/scripts >/dev/null && exec bash /ws/scripts/ci_toolchain_build.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-${{ strategy.job-index }}
          path: |
            ctx/

  analyze:
    runs-on: ubuntu-24.04
    needs: [extract, toolchains]
    if: always() && needs.extract.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: arts
          merge-multiple: false
      - name: Fingerprint match rate (toolchain identity)
        run: |
          { echo '## 関数指紋一致率: 公式 vs lg12 ビルド (高いほど移植可能)'
            echo '```'
            OF=$(find arts/official -name official_fp.txt | head -1)
            F12=$(find arts -path '*tc-*' -name fp12.txt | sort)
            python3 scripts/jem16k.py match "$OF" $F12 2>&1 || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: patches.json summary
        run: |
          find arts -name patches.json | sort | while read -r pj; do
            d=$(dirname "$pj")
            echo "---"
            echo "### $(head -1 "$d/meta.txt" 2>/dev/null || echo $d)"
            jq -c '.totals | {funcs, identical, changed_funcs, exact, renamed,
              ambig, unaligned: (.unaligned_funcs | length),
              missing: (.missing_in14 | length)}' "$d/patches.json"
            jq '.totals.pattern_census | to_entries[:12]' "$d/patches.json"
          done > summary.txt 2>&1
          { echo '## lg12→lg14 差分の内訳 (conf=exact/renamed が多いほど安全)'
            echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
